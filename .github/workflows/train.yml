name: Training Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train
        run: PYTHONPATH=. python src/train_models.py
      - name: Evaluate
        run: PYTHONPATH=. python src/evaluate.py
      - name: Uplift modeling
        run: PYTHONPATH=. python src/train_uplift.py
      - name: Evaluate uplift
        run: PYTHONPATH=. python src/evaluate_uplift.py
      - name: Promotion gate
        run: PYTHONPATH=. python src/promote_model.py
      - name: Generate SHAP
        run: PYTHONPATH=. python src/explainability.py
      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/production_model_active.pkl
            models/model_metadata_active.json
            reports/*.csv
            reports/*.png
